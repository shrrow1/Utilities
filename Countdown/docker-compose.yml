services:
  countdown:
    build: .
    container_name: countdown_app
    ports:
      - "8085:80"
    networks:
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.countdown.rule=Host(`countdown.home`)"
      - "traefik.http.routers.countdown.entrypoints=web"
      - "traefik.http.services.countdown.loadbalancer.server.port=80"
    restart: always

networks:
  proxy-network:
    external: true
