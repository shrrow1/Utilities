<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="countdownCanvas"></canvas>

    <script>
        const canvas = document.getElementById('countdownCanvas');
        const ctx = canvas.getContext('2d');
        const daysRemaining = {{ days }};
        const workDaysRemaining = {{ work_days }};
        const holidayCalc = {{ holiday_calc }};
        
        let xPos = -50;
        let frame = 0;
        let lapCount = 0;
        
        // Tracking current vs next colors
        let currentNumCol = '#333';
        let currentMsgCol = '#333';
        let nextNumCol = getRandomColor();
        let nextMsgCol = getRandomColor();

        function getRandomColor() {
            return `hsl(${Math.random() * 360}, 80%, 65%)`;
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function drawStickFigure(x, y, frame) {
            const scale = Math.min(canvas.width, canvas.height) * 0.05;
            const walkCycle = Math.sin(frame * 0.2);
            
            ctx.strokeStyle = '#ecf0f1';
            ctx.lineWidth = 3;
            ctx.beginPath();

            // Head
            ctx.arc(x, y - scale * 2, scale * 0.4, 0, Math.PI * 2);
            
            // Body
            ctx.moveTo(x, y - scale * 1.6);
            ctx.lineTo(x, y - scale * 0.6);

            // Arms
            ctx.moveTo(x, y - scale * 1.4);
            ctx.lineTo(x + walkCycle * scale * 0.5, y - scale * 0.8);
            ctx.moveTo(x, y - scale * 1.4);
            ctx.lineTo(x - walkCycle * scale * 0.5, y - scale * 0.8);

            // Legs
            ctx.moveTo(x, y - scale * 0.6);
            ctx.lineTo(x + walkCycle * scale * 0.6, y);
            ctx.moveTo(x, y - scale * 0.6);
            ctx.lineTo(x - walkCycle * scale * 0.6, y);

            ctx.stroke();
        }

        function drawText(numCol, txtCol, screenIndex) {
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            let displayDays, displayMsg;
            
            if (screenIndex === 0) {
                displayDays = daysRemaining;
                displayMsg = 'days to go and counting .....';
            } else if (screenIndex === 1) {
                displayDays = workDaysRemaining;
                displayMsg = 'working days left .....';
            } else {
                displayDays = holidayCalc;
                displayMsg = '... excluding holidays';
            }
            
            // Draw Number
            ctx.fillStyle = numCol;
            ctx.font = `bold ${Math.min(canvas.width, canvas.height) * 0.3}px sans-serif`;
            ctx.fillText(displayDays, canvas.width / 2, canvas.height / 2 - 20);

            // Draw Message
            ctx.fillStyle = txtCol;
            ctx.font = `${Math.min(canvas.width, canvas.height) * 0.05}px sans-serif`;
            ctx.fillText(displayMsg, canvas.width / 2, canvas.height / 2 + (canvas.height * 0.15));
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Background gradient
            const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width/2);
            grad.addColorStop(0, '#2c3e50');
            grad.addColorStop(1, '#000000');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const screenIndex = lapCount % 3;

            // 1. Draw "Current" Layer
            drawText(currentNumCol, currentMsgCol, screenIndex);

            // 2. Draw "Next" Layer (Clipped)
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, xPos, canvas.height);
            ctx.clip();
            drawText(nextNumCol, nextMsgCol, screenIndex);
            ctx.restore();

            // Animate Stick Figure
            const slowBaseSpeed = canvas.width / 600;
            
            // Pick days to use for urgency
            let daysForUrgency = daysRemaining;
            if (screenIndex === 1) daysForUrgency = workDaysRemaining;
            if (screenIndex === 2) daysForUrgency = holidayCalc;

            const urgencyLimit = 200;
            const urgencyFactor = Math.pow(Math.max(0, (urgencyLimit - daysForUrgency) / urgencyLimit), 3);
            const urgencySpeed = urgencyFactor * (canvas.width / 60);

            const currentSpeed = slowBaseSpeed + urgencySpeed;
            xPos += currentSpeed;

            if (xPos > canvas.width + 50) {
                xPos = -50;
                lapCount++;
                currentNumCol = nextNumCol;
                currentMsgCol = nextMsgCol;
                nextNumCol = getRandomColor();
                nextMsgCol = getRandomColor();
            }

            frame += currentSpeed * 0.2;
            drawStickFigure(xPos, canvas.height / 2 + (canvas.height * 0.35), frame);

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
