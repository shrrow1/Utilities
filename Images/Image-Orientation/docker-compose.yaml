  ollama:
    image: docker.io/ollama/ollama:latest
    ports:
      - 127.0.0.1:11434:11434
#      - 7869:11434
    volumes:
      - .:/code
      - ./ollama/ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ollama-docker

  ollama-model-pull:
    image: docker.io/ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://127.0.0.1:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen3-vl:2b}"]
    restart: "no"
    networks:
      - ollama-docker

