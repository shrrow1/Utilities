services:
  bincollections:

    container_name: bincollections
    env_file: "bincollections.env"
    build:
      context: ../
      dockerfile: BinNotifications/Dockerfile
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${HOST_CREDENTIALS_DIRECTORY}
        target: /usr/src/app/Credentials
      - type: bind
        source: ${HOST_LOG_DIRECTORY}
        target: /usr/src/app/logs